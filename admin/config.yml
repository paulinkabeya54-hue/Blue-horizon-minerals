backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - name: "site"
        label: "Blue Horizon Minerals — Content"
        file: "content.json"
        fields:
          - label: "Hero Section (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small label above title", name: "eyebrow", widget: "string" }
              - { label: "Title — part before highlighted word", name: "title_line1", widget: "string" }
              - { label: "Title — highlighted word (gold)", name: "title_highlight", widget: "string" }
              - { label: "Title — part after highlighted word", name: "title_line2", widget: "string" }
              - { label: "Subtitle text", name: "subtitle", widget: "text" }

          - label: "About Us Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Section title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
              - { label: "Stat 1 — number", name: "stat1_number", widget: "string" }
              - { label: "Stat 1 — label", name: "stat1_label", widget: "string" }
              - { label: "Stat 2 — number", name: "stat2_number", widget: "string" }
              - { label: "Stat 2 — label", name: "stat2_label", widget: "string" }
              - { label: "Stat 3 — number", name: "stat3_number", widget: "string" }
              - { label: "Stat 3 — label", name: "stat3_label", widget: "string" }

          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Symbol (2 letters, e.g. Au)", name: "symbol", widget: "string" }
              - { label: "Product name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }

          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Number (e.g. 01)", name: "number", widget: "string" }
              - { label: "Service title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Why Us"
            name: "why_us"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone number", name: "phone", widget: "string" }
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline text", name: "tagline", widget: "text" }
              - { label: "Copyright line", name: "copyright", widget: "string" }
